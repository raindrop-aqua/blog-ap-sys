<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>坊っちゃん人物相関図</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500&display=swap">
<style>
/* Layout: 見出し → 凡例と切替 → 図(左)+人物カード(右)、狭い画面では縦積み */
:root{
  --bg:#F3F5F7; --panel:#FFFFFF; --ink:#1D2430; --muted:#5B6575; --line:#D5DAE1;
  --ai:#2E4A7A; --mikata:#2F7A5F; --teki:#B3472F; --chuu:#6B7480; --machi:#9A6B1E;
  --memory:#8C95A3;
  --f-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141922; --panel:#1C2330; --ink:#E6EAF0; --muted:#9AA4B3; --line:#2E3746;
  --ai:#7E9BD1; --mikata:#5FB894; --teki:#E07A60; --chuu:#9AA3AE; --machi:#D3A452; --memory:#6E7888; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141922; --panel:#1C2330; --ink:#E6EAF0; --muted:#9AA4B3; --line:#2E3746;
  --ai:#7E9BD1; --mikata:#5FB894; --teki:#E07A60; --chuu:#9AA3AE; --machi:#D3A452; --memory:#6E7888; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 40px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,4vw,36px);line-height:1.2;margin:0;text-wrap:balance}
.lead{margin:6px 0 0;color:var(--muted);max-width:68ch}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block}
.ln{width:26px;height:0;border-top:2px solid var(--ink);display:inline-block}
.ln.dash{border-top:2px dashed var(--memory)}
.toggle{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--ink)}
.main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
#cy{height:640px;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0}
@media (max-width:860px){#cy{height:520px}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0;align-self:start}
.card h2{font-family:var(--f-display);font-size:22px;margin:0;line-height:1.3}
.alias{color:var(--muted);font-size:13px;margin:2px 0 10px}
.badge{display:inline-block;font-size:11px;letter-spacing:.04em;padding:1px 8px;border-radius:999px;border:1px solid currentColor;margin-right:6px}
.b-text{color:var(--mikata)} .b-mem{color:var(--memory)}
.role{margin:8px 0 12px}
.rels{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.rels li{font-size:13.5px}
.rels .who{font-weight:500}
.rels .ev{display:block;color:var(--muted);font-size:12.5px}
.rels .ev q{font-family:var(--f-display)}
.note{font-size:12.5px;color:var(--muted);max-width:80ch}
button.reset{font:inherit;font-size:13px;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
button.reset:focus-visible,.toggle input:focus-visible{outline:2px solid var(--ai);outline-offset:2px}
</style>

<div class="wrap">
  <header>
    <h1>坊っちゃん 人物相関図</h1>
    <p class="lead">夏目漱石『坊っちゃん』(1906)の登場人物と関係。実線は青空文庫の本文で根拠を確認した関係、破線は本文を確認できていない章(第五章以降)の、記憶にもとづく関係です。人物をタップすると根拠が出ます。</p>
  </header>

  <div class="bar" aria-label="凡例">
    <span class="chip"><span class="dot" style="background:var(--ai)"></span>家族・東京</span>
    <span class="chip"><span class="dot" style="background:var(--mikata)"></span>おれの味方・同情</span>
    <span class="chip"><span class="dot" style="background:var(--teki)"></span>赤シャツ派</span>
    <span class="chip"><span class="dot" style="background:var(--chuu)"></span>学校・中立</span>
    <span class="chip"><span class="dot" style="background:var(--machi)"></span>松山の町の人</span>
    <span class="chip"><span class="ln"></span>本文で確認</span>
    <span class="chip"><span class="ln dash"></span>要検証</span>
    <label class="toggle"><input type="checkbox" id="showMem" checked>要検証の関係も表示</label>
    <label class="toggle"><input type="checkbox" id="showMinor" checked>端役も表示</label>
    <button class="reset" id="fit" type="button">全体を表示</button>
  </div>

  <div class="main">
    <div id="cy" role="img" aria-label="坊っちゃんの登場人物の関係を示すネットワーク図"></div>
    <aside class="card" id="card" aria-live="polite"></aside>
  </div>

  <p class="note">抽出状況: 第一章〜第四章途中は本文から人物・関係・根拠を抽出済み。第五章〜第十一章は本文を取得できなかったため未検証です。本文テキストがあれば、破線をすべて根拠つきの実線に置き換えられます。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.28.1/cytoscape.min.js"></script>
<script>
const P=[
 {id:"ore",label:"おれ",alias:"坊っちゃん/天麩羅先生/赤手拭",role:"語り手。物理学校を出て四国の中学の数学教師に",g:"mikata",s:"text",ch:"一",x:520,y:330,main:1},
 {id:"kiyo",label:"清",alias:"婆さん",role:"十年来召し使っている下女。おれを溺愛",g:"ai",s:"text",ch:"一",x:330,y:120,main:1},
 {id:"oyaji",label:"おやじ",alias:"",role:"父。のちに卒中で死去",g:"ai",s:"text",ch:"一",x:120,y:60,main:1},
 {id:"haha",label:"母",alias:"おっかさん",role:"母。おれが幼いころ病死",g:"ai",s:"text",ch:"一",x:60,y:160,main:0},
 {id:"ani",label:"兄",alias:"",role:"商業学校を出て九州の会社へ",g:"ai",s:"text",ch:"一",x:190,y:200,main:1},
 {id:"oi",label:"清の甥",alias:"",role:"裁判所の書記",g:"ai",s:"text",ch:"一",x:400,y:20,main:0},
 {id:"kantaro",label:"勘太郎",alias:"",role:"質屋・山城屋の倅",g:"ai",s:"text",ch:"一",x:60,y:300,main:0},
 {id:"furukawa",label:"古川",alias:"",role:"田圃の持ち主",g:"ai",s:"text",ch:"一",x:120,y:390,main:0},
 {id:"kanko",label:"兼公と角",alias:"大工の兼公/肴屋の角",role:"子ども時代のいたずら仲間",g:"ai",s:"text",ch:"一",x:250,y:320,main:0},
 {id:"tanuki",label:"狸",alias:"校長",role:"中学校の校長",g:"chuu",s:"text",ch:"二",x:680,y:150,main:1},
 {id:"akashatsu",label:"赤シャツ",alias:"教頭/文学士",role:"教頭",g:"teki",s:"text",ch:"二",x:800,y:330,main:1},
 {id:"yamaarashi",label:"山嵐",alias:"堀田",role:"数学の主任。生徒に人望がある",g:"mikata",s:"text",ch:"二",x:390,y:470,main:1},
 {id:"uranari",label:"うらなり",alias:"古賀",role:"英語の教師",g:"mikata",s:"text",ch:"二",x:330,y:620,main:1},
 {id:"noda",label:"野だいこ",alias:"のだいこ/野だ(吉川 ※要検証)",role:"画学の教師。芸人風",g:"teki",s:"text",ch:"二",x:930,y:470,main:1},
 {id:"kangaku",label:"漢学の先生",alias:"お爺さん",role:"漢学の教師",g:"chuu",s:"text",ch:"二",x:540,y:150,main:0},
 {id:"kozukai",label:"小使",alias:"",role:"学校の用務員",g:"chuu",s:"text",ch:"二",x:430,y:220,main:0},
 {id:"ikagin",label:"いか銀",alias:"",role:"骨董を売買する、最初の下宿の主人",g:"machi",s:"text",ch:"二",x:220,y:480,main:1},
 {id:"seito",label:"生徒・寄宿生",alias:"",role:"中学の生徒たち",g:"chuu",s:"text",ch:"三",x:660,y:500,main:1},
 {id:"madonna",label:"マドンナ",alias:"遠山の令嬢",role:"町の評判の美人",g:"chuu",s:"mem",ch:"五?",x:560,y:660,main:1},
 {id:"uhaha",label:"うらなりの母",alias:"",role:"古賀の母",g:"mikata",s:"mem",ch:"七?",x:170,y:660,main:0},
 {id:"hagino",label:"萩野の婆さん",alias:"",role:"二番目の下宿の女主人",g:"machi",s:"mem",ch:"七?",x:430,y:760,main:1},
 {id:"geisha",label:"芸者",alias:"",role:"赤シャツの馴染み",g:"teki",s:"mem",ch:"?",x:960,y:220,main:0},
 {id:"shihan",label:"師範学校の生徒",alias:"",role:"中学生と喧嘩になる",g:"chuu",s:"mem",ch:"十?",x:800,y:610,main:0}
];
const E=[
 ["kiyo","ore","溺愛","一","text","おれを非常に可愛がってくれた"],
 ["oyaji","ore","可愛がらない","一","text","おれを可愛がってくれなかった"],
 ["haha","ani","ひいき","一","text","兄ばかり贔屓にしていた"],
 ["ani","ore","不仲","一","text","兄とは無論仲がよくない"],
 ["oyaji","kiyo","主人と下女","一","text","十年来召し使っている清"],
 ["kiyo","ani","評価が低い","一","text","とても役には立たない"],
 ["kiyo","oi","甥","一","text","甥の厄介になりましょう"],
 ["kantaro","ore","喧嘩","一","text","栗を盗みにくる"],
 ["furukawa","ore","怒鳴り込む","一","text","真赤になって怒鳴り込んで"],
 ["kanko","ore","いたずら仲間","一","text","兼公と肴屋の角をつれて"],
 ["tanuki","ore","上司","二","text","校長室へ通した"],
 ["akashatsu","ore","同僚(教頭)","二","text","教頭のなにがしと云うのが居た"],
 ["yamaarashi","ore","世話・忠告","二","text","いい下宿を周旋してやる"],
 ["yamaarashi","ikagin","下宿を周旋","二","text","いい下宿を周旋してやる"],
 ["yamaarashi","seito","人望","二","text","一番生徒に人望がある"],
 ["ikagin","ore","下宿の主人","二","text","骨董を売買するいか銀"],
 ["seito","ore","からかい・反抗","三〜四","text","天麩羅先生"],
 ["tanuki","akashatsu","宿直免除の例外","四","text","狸と赤シャツは例外"],
 ["kozukai","ore","宿直の世話","四","text","小使を宿直部屋へ呼んで"],
 ["noda","akashatsu","腰巾着","五?","mem",""],
 ["noda","ore","敵対","?","mem",""],
 ["akashatsu","madonna","横恋慕","?","mem",""],
 ["uranari","madonna","元婚約","?","mem",""],
 ["akashatsu","uranari","延岡へ転任させる","?","mem",""],
 ["uhaha","uranari","母子","?","mem",""],
 ["uranari","hagino","下宿を紹介","七?","mem",""],
 ["hagino","ore","下宿のおかみ","七?","mem",""],
 ["ikagin","ore","追い出す","?","mem",""],
 ["akashatsu","yamaarashi","対立・讒言","?","mem",""],
 ["yamaarashi","ore","誤解→共闘","?","mem",""],
 ["akashatsu","ore","対立→制裁される","十一?","mem",""],
 ["akashatsu","geisha","馴染み","?","mem",""],
 ["tanuki","yamaarashi","辞職に追い込む","?","mem",""],
 ["shihan","seito","喧嘩","十?","mem",""]
];
const css=getComputedStyle(document.documentElement);
const col=k=>css.getPropertyValue("--"+k).trim();
const els=[...P.map(p=>({data:{...p,color:col(p.g)},position:{x:p.x,y:p.y},classes:(p.s==="mem"?"mem ":"")+(p.main?"":"minor")})),
 ...E.map((e,i)=>({data:{id:"e"+i,source:e[0],target:e[1],label:e[2],ch:e[3],s:e[4],ev:e[5]},classes:e[4]==="mem"?"mem":""}))];
const cy=cytoscape({container:document.getElementById("cy"),elements:els,layout:{name:"preset",padding:30},
 wheelSensitivity:0.25,minZoom:0.3,maxZoom:2.5,
 style:[
  {selector:"node",style:{"background-color":"data(color)","label":"data(label)","color":col("ink"),"font-family":"Noto Sans JP, sans-serif","font-size":15,"font-weight":500,"text-valign":"bottom","text-margin-y":6,"width":30,"height":30,"border-width":2,"border-color":col("panel"),"text-background-color":col("panel"),"text-background-opacity":0.85,"text-background-padding":2}},
  {selector:"node.minor",style:{"width":20,"height":20,"font-size":12,"font-weight":400}},
  {selector:"node.mem",style:{"border-style":"dashed","border-color":col("memory"),"border-width":2}},
  {selector:"node#ore",style:{"width":46,"height":46,"font-size":18}},
  {selector:"edge",style:{"width":1.6,"line-color":col("muted"),"target-arrow-color":col("muted"),"target-arrow-shape":"triangle","arrow-scale":0.8,"curve-style":"bezier","label":"data(label)","font-size":11,"color":col("muted"),"text-background-color":col("panel"),"text-background-opacity":0.9,"text-background-padding":2,"font-family":"Noto Sans JP, sans-serif"}},
  {selector:"edge.mem",style:{"line-style":"dashed","line-color":col("memory"),"target-arrow-color":col("memory")}},
  {selector:".faded",style:{"opacity":0.15}},
  {selector:"node:selected",style:{"border-color":col("ink"),"border-width":3}}
 ]});
function card(id){
  const n=cy.getElementById(id), d=n.data(), c=document.getElementById("card");
  const rels=n.connectedEdges().filter(e=>e.visible()).map(e=>{
    const ed=e.data(), other=ed.source===id?ed.target:ed.source, od=cy.getElementById(other).data();
    const dir=ed.source===id?"→ ":"← ";
    const ev=ed.s==="text"?`<span class="ev">第${ed.ch}章 <q>${ed.ev}</q></span>`:`<span class="ev">要検証(第${ed.ch}章・本文未確認)</span>`;
    return `<li><span class="who">${dir}${od.label}</span>:${ed.label}${ev}</li>`;}).join("");
  c.innerHTML=`<h2>${d.label}</h2><p class="alias">${d.alias?"別名: "+d.alias:"別名なし"}</p>
   <span class="badge ${d.s==="text"?"b-text":"b-mem"}">${d.s==="text"?"本文で確認":"要検証"}</span><span class="badge" style="color:var(--muted)">初登場 第${d.ch}章</span>
   <p class="role">${d.role}</p><ul class="rels">${rels||"<li>表示中の関係はありません</li>"}</ul>`;
}
function focusOn(id){cy.elements().removeClass("faded");const n=cy.getElementById(id);
  cy.elements().not(n.closedNeighborhood()).addClass("faded");card(id);}
cy.on("tap","node",ev=>focusOn(ev.target.id()));
cy.on("tap",ev=>{if(ev.target===cy){cy.elements().removeClass("faded");}});
function apply(){const m=document.getElementById("showMem").checked,mi=document.getElementById("showMinor").checked;
  cy.batch(()=>{cy.elements().style("display","element");
    if(!m)cy.elements(".mem").style("display","none");
    if(!mi)cy.nodes(".minor").style("display","none");});
  const sel=cy.nodes(":selected");card(sel.length&&sel.visible()?sel.id():"ore");}
document.getElementById("showMem").addEventListener("change",apply);
document.getElementById("showMinor").addEventListener("change",apply);
document.getElementById("fit").addEventListener("click",()=>{cy.elements().removeClass("faded");cy.fit(cy.elements(":visible"),30);});
card("ore");
</script>

</body></html>
