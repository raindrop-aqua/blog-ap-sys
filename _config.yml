# 基本設定
title: 明日使える生成AI
description: "明日使える生成AIテクニックを紹介するサイト"
baseurl: "/blog-ap-sys"
url: "https://raindrop-aqua.github.io"

# テーマ
theme: minima

# マークダウン拡張
markdown: kramdown

# ビルド除外設定
# 独自にexcludeを定義するとJekyllの標準除外リスト(Gemfile等)が丸ごと上書きされるため、
# それらも含めて明示的に指定する
exclude:
  - README.md
  - docs/
  - Dockerfile
  - .dockerignore
  - preview.sh
  - Gemfile
  - Gemfile.lock
  - vendor/
  - node_modules/
