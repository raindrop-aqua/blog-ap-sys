<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>読む人のレベルを指定すると、同じ論文の説明がどう変わるか</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Lato:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>

     使い方: file://.../this.html#k | #e | #j | #h | #u
       k=幼稚園児 e=小学生 j=中学生 h=高校生 u=大学生

     文字サイズの下限は 22px（1200幅が本文幅690pxに縮むと約12.6px）。
     数字は出力に書かれていたものだけを使う。論文と照合して食い違いが
     見つかった箇所は、.flag（琥珀色のタグ）で示す。不要なら消してよい。

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --paper: #f4efe4;
    --card: #fffdf8;
    --ink: #24221d;
    --muted: #6c6559;
    --rule: #ddd3c0;
    --track: #e9e2d2;
    --indigo: #4f46e5;
    --indigo-ink: #3b34b8;
    --indigo-soft: #ecebff;
    --indigo-line: #cfccff;
    --amber: #b45309;
    --amber-soft: #fdf0dc;
    --amber-line: #efd3a4;
  }

  html { background: var(--paper); }
  body {
    width: 1200px; min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Sans 3', 'BIZ UDPGothic', sans-serif;
    font-feature-settings: 'palt' 1;
    position: relative;
  }
  body::before {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(circle, #cabfa8 1px, transparent 1.2px);
    background-size: 22px 22px;
    opacity: .35;
    pointer-events: none;
  }

  .sheet { position: relative; padding: 40px 48px 34px; }

  /* ---------- 上段 ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .site { font-family: Lato, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: .14em; color: var(--indigo-ink); }
  .stepper { display: flex; gap: 8px; }
  .stepper span {
    font-size: 22px; padding: 5px 14px; border: 2px solid var(--rule); border-radius: 999px;
    background: var(--card); color: var(--muted); font-weight: 600;
  }
  .stepper span.on { background: var(--indigo); border-color: var(--indigo); color: #fff; font-weight: 700; }

  h1 { margin-top: 22px; font-family: Lato, 'BIZ UDPGothic', sans-serif; font-weight: 900; font-size: 62px; line-height: 1.2; letter-spacing: .01em; }
  h1 em { font-style: normal; background: linear-gradient(transparent 62%, #ffd88a 62%, #ffd88a 94%, transparent 94%); padding: 0 2px; }

  .aititle { margin-top: 14px; font-size: 26px; line-height: 1.5; color: var(--muted); }
  .aititle b { color: var(--ink); font-weight: 700; }

  /* ---------- はじめに ---------- */
  .intro { margin-top: 24px; background: var(--card); border: 2px solid var(--rule); border-radius: 14px; padding: 18px 26px; }
  .tag { font-size: 22px; font-weight: 700; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
  .intro p { font-size: 26px; line-height: 1.6; }

  /* ---------- 5レーン ---------- */
  .lanes { margin-top: 20px; background: var(--card); border: 2px solid var(--rule); border-radius: 14px; }
  .lane { display: grid; grid-template-columns: 180px 300px 1fr; gap: 22px; padding: 22px 26px; border-top: 2px solid var(--rule); }
  .lane:first-child { border-top: 0; }

  .ln { display: flex; align-items: flex-start; gap: 12px; }
  .ln .n {
    width: 40px; height: 40px; border-radius: 10px; flex: none; display: grid; place-items: center;
    background: var(--indigo-soft); border: 2px solid var(--indigo-line);
    font-family: Lato, sans-serif; font-weight: 900; font-size: 22px; color: var(--indigo-ink);
  }
  .ln .t { font-size: 24px; font-weight: 700; line-height: 1.35; color: var(--muted); padding-top: 3px; }

  .bars { display: flex; flex-direction: column; gap: 14px; }
  .bh { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; column-gap: 10px; }
  .bl { font-size: 22px; color: var(--muted); line-height: 1.3; white-space: nowrap; }
  .bv { font-family: Lato, 'BIZ UDPGothic', sans-serif; font-size: 32px; font-weight: 900; line-height: 1.15; color: var(--indigo-ink); white-space: nowrap; margin-left: auto; }
  .amber .bv { color: var(--amber); }
  .track { position: relative; height: 16px; margin-top: 6px; background: var(--track); border-radius: 4px; overflow: hidden; }
  .track i { position: absolute; top: 0; bottom: 0; left: 0; background: var(--indigo); border-radius: 4px; }
  .amber .track i { background: var(--amber); }
  .track i.range { background: var(--amber); opacity: .38; border-radius: 0 4px 4px 0; }
  .track i.solid { border-radius: 4px 0 0 4px; }
  .track i.fade { background: linear-gradient(90deg, var(--indigo), rgba(79,70,229,0)); border-radius: 0; }
  .track.split i.a { left: 0; width: calc(50% - 2px); background: var(--indigo); }
  .track.split i.b { left: calc(50% + 2px); width: calc(50% - 2px); background: var(--amber); }
  .splitlab { display: flex; justify-content: space-between; margin-top: 6px; font-size: 22px; color: var(--muted); }

  .txt { font-size: 26px; line-height: 1.62; }
  .flag {
    display: inline-block; margin-top: 10px; padding: 4px 12px; border-radius: 8px;
    background: var(--amber-soft); border: 2px solid var(--amber-line);
    font-size: 22px; line-height: 1.4; color: var(--amber); font-weight: 700;
  }

  /* ---------- 結論・注意・用語 ---------- */
  .box { margin-top: 18px; border-radius: 14px; padding: 18px 26px; }
  .concl { background: var(--indigo-soft); border: 2px solid var(--indigo-line); }
  .concl .tag { color: var(--indigo-ink); }
  .concl p { font-size: 26px; line-height: 1.6; }
  .notes { background: var(--amber-soft); border: 2px solid var(--amber-line); }
  .notes .tag { color: var(--amber); }
  .notes ul { list-style: none; display: flex; flex-direction: column; gap: 8px; }
  .notes li { font-size: 24px; line-height: 1.55; padding-left: 26px; position: relative; }
  .notes li::before { content: ''; position: absolute; left: 4px; top: .62em; width: 10px; height: 10px; border-radius: 3px; background: var(--amber); }
  .terms { background: var(--card); border: 2px solid var(--rule); }
  .terms dl { display: flex; flex-direction: column; gap: 6px; }
  .terms .row { display: grid; grid-template-columns: 230px 1fr; gap: 18px; font-size: 24px; line-height: 1.55; }
  .terms dt { font-weight: 700; }
  .terms dd { color: var(--ink); }

  footer { margin-top: 18px; font-size: 22px; line-height: 1.5; color: var(--muted); }
</style>
</head>

   { t: '肯定派と否定派はほぼ拮抗しています。',
     split: { v: 'ほぼ拮抗', a: '肯定派', b: '否定派' } }
  ],
  concl: '多数派はまだなく、今は過渡期である。だから政府は、性急にルールを作らず様子を見るのがよい、と主張しています。',
  notesTag: '読むときの注意点',
  notes: [
   '因果関係は断定できません。',
   '探索的研究です。ネットモニターの自己申告なので、クリエイター全体を代表するとは限りません。',
   '説明がついていない結果もあります。女性が一貫してAIに否定的な理由について、論文は「不明」としています。',
   '調査は2023年9月で、今は2026年です。その後に意見がどう変わったかは、この論文からは分かりません。'
  ],
  termsTag: '統計用語のミニ解説',
  terms: [
   ['ロジット回帰', '「使う/使わない」のような二択の結果に、年齢や性別などがどれだけ影響するかを調べる手法'],
   ['限界効果', 'ある条件によって、利用率が何%ポイント変わるかを示した数値'],
   ['有意(星印)', 'その関係が偶然とは考えにくい、という意味']
  ]
 }
};

/* ------------------------------------------------------------ */
const key = (location.hash || '#k').slice(1);
const L = D[key] || D.k;

function bar(b) {
  const cls = b.c === 'amber' ? 'amber' : '';
  let fills = '';
  if (b.range) {
    const [lo, hi] = b.range;
    fills = `<i class="solid" style="width:${lo}%"></i>`
          + `<i class="range" style="left:${lo}%;width:${hi - lo}%;${b.c === 'ind' ? 'background:var(--indigo);opacity:.4' : ''}"></i>`;
    if (b.c === 'amber') fills = `<i style="width:${lo}%"></i><i class="range" style="left:${lo}%;width:${hi - lo}%"></i>`;
  } else if (b.open) {
    fills = `<i class="solid" style="width:${b.p}%"></i><i class="fade" style="left:${b.p}%;width:14%"></i>`;
  } else {
    fills = `<i style="width:${b.p}%"></i>`;
  }
  return `<div class="${cls}"><div class="bh"><span class="bl">${b.l}</span><span class="bv">${b.v}</span></div><div class="track">${fills}</div></div>`;
}

function lane(i, ln) {
  let figure;
  if (ln.split) {
    figure = `<div><div class="bh"><span class="bl">賛否の割合</span><span class="bv">${ln.split.v}</span></div>`
           + `<div class="track split"><i class="a"></i><i class="b"></i></div>`
           + `<div class="splitlab"><span>${ln.split.a}</span><span>${ln.split.b}</span></div></div>`;
  } else {
    figure = ln.b.map(bar).join('');
  }
  const flag = ln.flag ? `<div class="flag">${ln.flag}</div>` : '';
  return `<div class="lane">
    <div class="ln"><span class="n">${i + 1}</span><span class="t">${LANES[i]}</span></div>
    <div class="bars">${figure}</div>
    <div><div class="txt">${ln.t}</div>${flag}</div>
  </div>`;
}

const stepper = STEPS.map(([k, n]) => `<span class="${k === key ? 'on' : ''}">${n}</span>`).join('');
const notes = L.notes.map(n => `<li>${n}</li>`).join('');
const terms = L.terms.map(([t, d]) => `<div class="row"><dt>${t}</dt><dd>${d}</dd></div>`).join('');

document.getElementById('root').innerHTML = `
  <div class="top"><div class="site">明日使える生成AI ／ 検証データ</div><div class="stepper">${stepper}</div></div>
  <h1><em>${L.name}</em>でもわかるように</h1>
  <div class="aititle">出力のタイトル: <b>${L.aititle}</b></div>
  <div class="intro"><div class="tag">${L.introTag}</div><p>${L.intro}</p></div>
  <div class="lanes">${L.lanes.map((ln, i) => lane(i, ln)).join('')}</div>
  <div class="box concl"><div class="tag">結論</div><p>${L.concl}</p></div>
  <div class="box notes"><div class="tag">${L.notesTag}　${L.notes.length}点</div><ul>${notes}</ul></div>
  <div class="box terms"><div class="tag">${L.termsTag}　${L.terms.length}つ</div><dl>${terms}</dl></div>
  <footer>Claude sonnet 5 に同じPDFを読ませ、読む人のレベルだけ替えて出させた説明（各1回）。文言は出力から抜粋・一部省略。<br>素材: GLOCOM Discussion Paper 24-001「画像生成AIについてのクリエイターの賛否は割れている」（2024年4月）</footer>
`;

/* レンダリング後の高さをDOMに書き出す（./render用の計測） */
document.fonts.ready.then(() => {
  document.documentElement.setAttribute('data-h', String(document.getElementById('root').offsetHeight));
});
</script>
</body>
</html>
